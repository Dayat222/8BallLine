name: Build & Release 8BallLine APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Decode Release Keystore (if configured)
      id: keystore
      env:
        KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_B64" ]; then
          echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.keystore"
          echo "has_keystore=true" >> "$GITHUB_OUTPUT"
        else
          echo "has_keystore=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Build Signed Release APK
      if: steps.keystore.outputs.has_keystore == 'true'
      env:
        RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
        RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        ./gradlew assembleRelease --stacktrace
        cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/8BallLine-latest.apk

    - name: Build Debug APK (Fallback when no keystore secret)
      if: steps.keystore.outputs.has_keystore != 'true'
      run: |
        ./gradlew assembleDebug --stacktrace
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/8BallLine-latest.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 8BallLine-apk
        path: app/build/outputs/apk/8BallLine-latest.apk
        retention-days: 14

    - name: Publish GitHub Release for OTA
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/8BallLine-latest.apk
        generate_release_notes: true
